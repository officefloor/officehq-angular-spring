# Per-layer source roots and tooling settings for this project.
layers:
  frontend:
    root: src/main/frontend/src
    ext: [ts]
    jscpd_format: typescript
    unit_vocabulary: angular
    handler_pattern: "/features/[^:]*::"
    function_package_glob: "src/main/frontend/src/app/features/**/*.ts"
  backend:
    root: src/main/java
    ext: [java]
    jscpd_format: java
    handler_pattern: "Controller[^:]*::"
