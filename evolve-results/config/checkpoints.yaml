# The ordered, cumulative checkpoint stream. Each is applied on top of the committed result of the
# previous one, GROWING ONE APP FROM A NEAR-EMPTY BASE (no tables at cp01) via ~250 plain-English
# change requests. Domain: a generic business app — CLIENTS, PROJECTS (renamed to JOBS at cp52),
# INVOICES — what an OfficeHQ user actually builds. See DESIGN.md.
#
# EACH CHECKPOINT:
#   request : the plain-English change request, as a non-technical user would type it (given to
#             the agent, self-contained, no checkpoint numbers).
#   test    : the experimenter-authored Playwright spec — the OBJECTIVE gate — also shown to the
#             agent so it knows the exact data-testid anchors, values, and audit records to satisfy.
#   type    : additive | mutative.  mutates : the prior checkpoint numbers a mutative revises.
#
# TWO ASSERTION CHANNELS (DESIGN.md §3): the UI (data-testid) for user-visible behaviour, and the
# known AUDIT FILE for side-effects (support/audit.ts). Data is arranged per-spec via /__test__
# (reset+seed; reset also clears the audit file). Once introduced, a data-testid is immutable public
# API — never renamed/removed except by a mutative checkpoint that ships the updated prior specs.
#
# MUTATIVE checkpoints ship updated copies of the prior specs they break in a sibling
# `acceptance/specs/cp<NN>/` folder (auto-discovered; installed by basename so they WIN over the
# prior originals in the cumulative gate suite). Each updated copy must carry forward ALL earlier
# mutations to that basename. A regression on a checkpoint listed in `mutates` is INTENDED; breakage
# on any other prior is a true regression (incl. seed-path breakage — DESIGN.md §6).
#
# BLIND: each checkpoint runs a fresh agent with no memory of prior checkpoints and WITHOUT the
# prior specs — only the current code, its request, and its own spec.

checkpoints:
  - id: cp01_clients
    type: additive
    test: acceptance/specs/cp01_clients.spec.ts
    request: |
      I want to keep track of my clients. Let me add a client with their name and email.
      Show me all my clients in one list.

  - id: cp02_client_email_validation
    type: additive
    test: acceptance/specs/cp02_client_email_validation.spec.ts
    request: |
      Every client needs an email. Do not let me save one without a proper email address.

  - id: cp03_projects
    type: additive
    test: acceptance/specs/cp03_projects.spec.ts
    request: |
      I want to track the projects I do for clients. Let me add a project and pick which client it
      is for. Show each project with the client's name.

  - id: cp04_project_invoices
    type: additive
    test: acceptance/specs/cp04_project_invoices.spec.ts
    request: |
      When I open a project I want to see its invoices. Show me what they add up to. Let me add a
      new invoice for an amount.

  - id: cp05_invoice_pay_audit
    type: additive
    test: acceptance/specs/cp05_invoice_pay_audit.spec.ts
    request: |
      Let me mark an invoice as paid. Keep a record every time I do so I can check back later.

  - id: cp06_client_search
    type: additive
    test: acceptance/specs/cp06_client_search.spec.ts
    request: |
      My client list is getting long. Give me a box to search for a client by name.

  - id: cp07_client_detail_projects
    type: additive
    test: acceptance/specs/cp07_client_detail_projects.spec.ts
    request: |
      When I open a client show me the projects I am doing for them.

  - id: cp08_dashboard
    type: additive
    test: acceptance/specs/cp08_dashboard.spec.ts
    request: |
      I want a home screen. Show me how many clients and projects I have. Show me how much money I
      am still owed.

  - id: cp09_currency_format
    type: mutative
    mutates: [4, 8]
    test: acceptance/specs/cp09_currency_format.spec.ts
    request: |
      Show money properly everywhere. Use a dollar sign and cents, like $100.00.

  - id: cp10_invoice_amount_positive
    type: additive
    test: acceptance/specs/cp10_invoice_amount_positive.spec.ts
    request: |
      Do not let me add an invoice for nothing. The amount has to be more than zero.

  - id: cp11_invoice_dates
    type: additive
    test: acceptance/specs/cp11_invoice_dates.spec.ts
    request: |
      Put two dates on each invoice. One for when it went out. One for when it is due. Show them both.

  - id: cp12_invoice_sort_due
    type: additive
    test: acceptance/specs/cp12_invoice_sort_due.spec.ts
    request: |
      Let me sort a project's invoices by their due date.

  - id: cp13_invoice_lifecycle
    type: mutative
    mutates: [5]
    test: acceptance/specs/cp13_invoice_lifecycle.spec.ts
    request: |
      Invoices should move through stages. First a draft. Then I send it. Then it gets paid. Keep a
      record when I send one. Only let me take payment once it has been sent.

  - id: cp14_all_invoices
    type: additive
    test: acceptance/specs/cp14_all_invoices.spec.ts
    request: |
      Give me one place that lists all my invoices from every project. Show which project each one
      is for. Show what stage it is at.

  - id: cp15_invoice_status_filter
    type: additive
    test: acceptance/specs/cp15_invoice_status_filter.spec.ts
    request: |
      Let me narrow that list to one stage. For example only the ones I have sent.

  - id: cp16_client_contacts
    type: additive
    test: acceptance/specs/cp16_client_contacts.spec.ts
    request: |
      For each client let me keep their contacts. Store a name, an email and their role. Show them
      on the client's page.

  - id: cp17_outstanding_sent_only
    type: mutative
    mutates: [8]
    test: acceptance/specs/cp17_outstanding_sent_only.spec.ts
    request: |
      The money I am owed should only count invoices I have actually sent. Do not count drafts.

  - id: cp18_contact_email_validation
    type: additive
    test: acceptance/specs/cp18_contact_email_validation.spec.ts
    request: |
      Contacts need a good email too. Do not let me save one with a bad email.

  - id: cp19_client_badges
    type: additive
    test: acceptance/specs/cp19_client_badges.spec.ts
    request: |
      On a client's page show me how many projects and contacts they have.

  - id: cp20_project_tasks
    type: additive
    test: acceptance/specs/cp20_project_tasks.spec.ts
    request: |
      Let me keep a task list on each project. Let me tick things off as I finish them.

  - id: cp21_invoice_line_items
    type: mutative
    mutates: [4]
    test: acceptance/specs/cp21_invoice_line_items.spec.ts
    request: |
      I do not want to type one figure for an invoice. Let me list the things I am charging for.
      For each one give a description, how many, and the price each. Work out the total for me.

  - id: cp22_line_items_edit
    type: additive
    test: acceptance/specs/cp22_line_items_edit.spec.ts
    request: |
      Let me change or remove those charge lines on an invoice. Update the total when I do.

  - id: cp23_task_filter
    type: additive
    test: acceptance/specs/cp23_task_filter.spec.ts
    request: |
      Let me see just the open tasks on a project. Or just the finished ones.

  - id: cp24_project_delete_audit
    type: additive
    test: acceptance/specs/cp24_project_delete_audit.spec.ts
    request: |
      Let me delete a project I no longer need. Keep a record that I did.

  - id: cp25_project_archive
    type: mutative
    mutates: [3, 7, 24]
    test: acceptance/specs/cp25_project_archive.spec.ts
    request: |
      Do not really delete a project. Just tuck it away so it drops off my lists. Keep it off the
      main project list and off the list on the client's page. I do not want to lose anything.
      Note it when I do.

  - id: cp26_project_tags
    type: additive
    test: acceptance/specs/cp26_project_tags.spec.ts
    request: |
      Let me put labels on projects so I can group them.

  - id: cp27_project_tag_filter
    type: additive
    test: acceptance/specs/cp27_project_tag_filter.spec.ts
    request: |
      Let me filter my projects by label.

  - id: cp28_project_notes
    type: additive
    test: acceptance/specs/cp28_project_notes.spec.ts
    request: |
      Let me write notes on a project. Show the newest one first.

  - id: cp29_client_archive
    type: mutative
    mutates: [1, 6]
    test: acceptance/specs/cp29_client_archive.spec.ts
    request: |
      Let me tuck away clients I no longer work with. They should drop off my list and my search.
      I do not want to lose them. Note it when I do.

  - id: cp30_invoice_payments
    type: additive
    test: acceptance/specs/cp30_invoice_payments.spec.ts
    request: |
      Let me record what a client has paid on an invoice. Store the amount and the date. Show it on
      the invoice.

  - id: cp31_invoice_amount_due
    type: additive
    test: acceptance/specs/cp31_invoice_amount_due.spec.ts
    request: |
      Show me how much is still left to pay on each invoice after any payments.

  - id: cp32_invoice_status_derived
    type: mutative
    mutates: [5, 13, 31]
    test: acceptance/specs/cp32_invoice_status_derived.spec.ts
    request: |
      Work out for me whether an invoice is paid, part paid or still owing. Base it on the payments
      I have recorded. I do not want to flip it to paid by hand anymore.

  - id: cp33_client_statement
    type: additive
    test: acceptance/specs/cp33_client_statement.spec.ts
    request: |
      Give me a statement for a client. Put all their invoices in one place. Show the total they
      still owe me.

  - id: cp34_project_status
    type: additive
    test: acceptance/specs/cp34_project_status.spec.ts
    request: |
      Let me mark a project as active, on hold or finished. Show which it is.

  - id: cp35_project_status_filter
    type: additive
    test: acceptance/specs/cp35_project_status_filter.spec.ts
    request: |
      Let me filter projects by active, on hold or finished.

  - id: cp36_client_active_projects_default
    type: mutative
    mutates: [7]
    test: acceptance/specs/cp36_client_active_projects_default.spec.ts
    request: |
      On a client's page show me just their active projects by default. Give me a way to also see
      the finished and hidden ones.

  - id: cp37_project_budget
    type: additive
    test: acceptance/specs/cp37_project_budget.spec.ts
    request: |
      Let me set a budget on a project. Show how much I have invoiced against it. Show what is left.

  - id: cp38_dashboard_overdue
    type: additive
    test: acceptance/specs/cp38_dashboard_overdue.spec.ts
    request: |
      On the home screen tell me how many sent invoices are overdue.

  - id: cp39_invoice_pagination
    type: additive
    test: acceptance/specs/cp39_invoice_pagination.spec.ts
    request: |
      The invoice list is huge now. Show it a page at a time with next and previous.

  - id: cp40_thousands_separator
    type: mutative
    mutates: [9, 21, 33]
    test: acceptance/specs/cp40_thousands_separator.spec.ts
    request: |
      For bigger amounts put commas in. Show it like $1,234.50. Do this everywhere an amount shows,
      including on the invoices and on the client statement.

  - id: cp41_invoice_cancel_audit
    type: additive
    test: acceptance/specs/cp41_invoice_cancel_audit.spec.ts
    request: |
      Let me cancel an invoice I sent by mistake. It should stop counting toward what I am owed.
      Note it.

  - id: cp42_client_primary_contact
    type: additive
    test: acceptance/specs/cp42_client_primary_contact.spec.ts
    request: |
      Let me pick a main contact for each client. Show who it is.

  - id: cp43_global_search
    type: additive
    test: acceptance/specs/cp43_global_search.spec.ts
    request: |
      Give me one search box. Have it look across both clients and projects.

  - id: cp44_client_unique_email
    type: mutative
    mutates: [1]
    test: acceptance/specs/cp44_client_unique_email.spec.ts
    request: |
      Do not let me add two clients with the same email.

  - id: cp45_client_edit
    type: additive
    test: acceptance/specs/cp45_client_edit.spec.ts
    request: |
      Let me fix a client's name or email from the list.

  - id: cp46_line_item_qty_unit
    type: additive
    test: acceptance/specs/cp46_line_item_qty_unit.spec.ts
    request: |
      On the charge lines let me say how many and the unit. Show the amount for each line.

  - id: cp47_invoice_discount
    type: additive
    test: acceptance/specs/cp47_invoice_discount.spec.ts
    request: |
      Let me take a percentage off an invoice as a discount. Show the subtotal, the discount and the
      final total.

  - id: cp48_discount_everywhere
    type: mutative
    mutates: [17, 31, 33]
    test: acceptance/specs/cp48_discount_everywhere.spec.ts
    request: |
      Make sure that discount shows up everywhere I check what is owed. That means the invoice, the
      statement and the home screen.

  - id: cp49_sales_tax
    type: mutative
    mutates: [21, 47]
    test: acceptance/specs/cp49_sales_tax.spec.ts
    request: |
      Let me add sales tax on top. Work it out after the discount. The amount shown for each invoice
      should include the tax.

  - id: cp50_combined_filter
    type: additive
    test: acceptance/specs/cp50_combined_filter.spec.ts
    request: |
      Let me filter by two things at once. For example active projects that have a certain label.

  - id: cp51_client_sort
    type: additive
    test: acceptance/specs/cp51_client_sort.spec.ts
    request: |
      Let me sort my clients by name. Or by how much they owe me.

  - id: cp52_project_to_job_rename
    type: mutative
    # A pure RELABEL (visible "project" -> "job"). data-testid is the stable contract the suite binds
    # to and must NOT change (CLAUDE.md), so this revises NO prior spec's assertions — the historic
    # specs keep their project-* testids untouched. Its own spec asserts only the visible-text change.
    mutates: []
    test: acceptance/specs/cp52_project_to_job_rename.spec.ts
    request: |
      I call these jobs, not projects. Please use that word everywhere.

  - id: cp53_job_code
    # Adding a required unique code CHANGES the job-creation contract, so this is mutative: the
    # create tests for jobs (cp03) and job status on create (cp34) must now supply a code. Without
    # updating them they would create a job with no code and fail — a test gap, not agent erosion.
    type: mutative
    mutates: [3, 34]
    test: acceptance/specs/cp53_job_code.spec.ts
    request: |
      Give each job a short reference code, set when creating the job. Keep it unique so no two jobs
      share one.

  - id: cp54_invoice_notes
    type: additive
    test: acceptance/specs/cp54_invoice_notes.spec.ts
    request: |
      Let me add notes to invoices too. Not just jobs.

  - id: cp55_dashboard_top_clients
    type: additive
    test: acceptance/specs/cp55_dashboard_top_clients.spec.ts
    request: |
      On the home screen show me my top five clients. Rank them by how much they owe.

  - id: cp56_payment_allocation
    type: mutative
    mutates: [30, 31, 32]
    test: acceptance/specs/cp56_payment_allocation.spec.ts
    request: |
      Sometimes a client pays one lump sum for several invoices. Let me split that payment across
      them. Each invoice's balance should come out right.

  - id: cp57_statement_by_job
    type: mutative
    mutates: [33]
    test: acceptance/specs/cp57_statement_by_job.spec.ts
    request: |
      On a client's statement group the invoices by job. Show a subtotal for each job.

  - id: cp58_client_restore
    type: additive
    test: acceptance/specs/cp58_client_restore.spec.ts
    request: |
      Let me bring back a client I tucked away earlier. I might start working with them again.

  - id: cp59_statement_printable
    type: additive
    test: acceptance/specs/cp59_statement_printable.spec.ts
    request: |
      Give me a clean printable summary of a client's statement. Show the grand total they owe.

  - id: cp60_multi_currency
    type: mutative
    # 41 belongs here: cp60 replaces the single `dashboard-outstanding-total` with one
    # `dashboard-outstanding-<CUR>` row per currency, which makes cp41's assertion on that anchor
    # obsolete by design. It was previously undeclared, so cp41 broke at cp60 in 10 of 10 chains
    # and was counted as a true regression rather than an intended mutation.
    mutates: [8, 17, 33, 40, 41, 48, 55]
    test: acceptance/specs/cp60_multi_currency.spec.ts
    request: |
      Different clients pay me in different currencies. Let me set each client's currency. Show
      their money in that currency everywhere I see it, including on their statement. On the home
      screen keep the totals separate for each currency. Show each client's figure in their own
      currency in the top clients list too. Do not add different currencies together.

# ===================================================================================================
# LONG-HORIZON EXTENSION — ACT II (cp61-120): "the calculation deepens"
# ---------------------------------------------------------------------------------------------------
# Act I (cp01-60) grew the app and established the invoice money pipeline. From here the stream
# CONCENTRATES: ~80% of checkpoints target `area: billing` — the one spine
#   lineItems -> subtotal -> discount(s) -> tax -> rounding -> TOTAL
#             -> payments/allocation -> amountDue -> status  (re-read by statement, dashboard, aging)
# so change keeps landing on the same code and erosion pressure accumulates there (docs/
# LONG_HORIZON_DESIGN.md). Change TYPE follows a 3-additive : 1-mutative rhythm (every 4th
# checkpoint mutative) to match spring-petclinic-rest-long-degradation and stay realistic: in real
# life you ADD features far more often than you revise them. Off-spine checkpoints (clients/jobs/
# tasks) are the low-pressure control region. Run harness.checkpoint_lint to audit both properties
# BEFORE a run. `area:` is metadata the blind agent never sees (only `request` + the visible spec).
# ===================================================================================================

  # ---- B1 (cp61-76): tax gets real --------------------------------------------------------------
  - id: cp61_default_tax_rate
    type: additive
    area: billing
    test: acceptance/specs/cp61_default_tax_rate.spec.ts
    request: |
      Let me set a standard tax rate once in my settings. New invoices should start with that rate
      already filled in, and I can still change it on an invoice.

  - id: cp62_client_phone
    type: additive
    area: clients
    test: acceptance/specs/cp62_client_phone.spec.ts
    request: |
      Let me keep a phone number for a client. Show it on their page.

  - id: cp63_line_tax_exempt
    type: additive
    area: billing
    test: acceptance/specs/cp63_line_tax_exempt.spec.ts
    request: |
      Some things I charge for are not taxable. Let me mark a charge line as tax-free so no tax is
      worked out on it.

  - id: cp64_tax_per_taxable_line
    type: mutative
    area: billing
    mutates: [49]
    test: acceptance/specs/cp64_tax_per_taxable_line.spec.ts
    request: |
      Work out the tax from only the charge lines that are taxable, not the whole invoice. The tax
      I am shown should ignore the tax-free lines.

  - id: cp65_tax_summary_line
    type: additive
    area: billing
    test: acceptance/specs/cp65_tax_summary_line.spec.ts
    request: |
      On the invoice show me a clear tax line — what was taxed and how much tax that came to.

  - id: cp66_client_tax_number
    type: additive
    area: billing
    test: acceptance/specs/cp66_client_tax_number.spec.ts
    request: |
      Some clients are tax registered. Let me record their tax number and show it on their invoices.

  - id: cp67_job_description
    type: additive
    area: jobs
    test: acceptance/specs/cp67_job_description.spec.ts
    request: |
      Let me write a short description for a job. Show it on the job.

  - id: cp68_second_tax
    type: mutative
    area: billing
    mutates: [49]
    test: acceptance/specs/cp68_second_tax.spec.ts
    request: |
      In some places there is a second tax on top, like a levy. Let me add a second tax rate as
      well. Both taxes should be worked out and the total should include both.

  - id: cp69_tax_inclusive_pricing
    type: additive
    area: billing
    test: acceptance/specs/cp69_tax_inclusive_pricing.spec.ts
    request: |
      For some clients my prices already include tax. For those let me show the tax that is baked
      into the price, worked back out of the total.

  - id: cp70_total_ex_and_inc_tax
    type: additive
    area: billing
    test: acceptance/specs/cp70_total_ex_and_inc_tax.spec.ts
    request: |
      On the invoice show me the total both before tax and after tax, so I can see both figures.

  - id: cp71_tax_rounding_per_line
    type: additive
    area: billing
    test: acceptance/specs/cp71_tax_rounding_per_line.spec.ts
    request: |
      Round the tax to the nearest cent on each taxable line. I do not want long trailing decimals.

  - id: cp72_round_per_line_then_sum
    type: mutative
    area: billing
    mutates: [21, 49]
    test: acceptance/specs/cp72_round_per_line_then_sum.spec.ts
    request: |
      Work out and round each line to the cent first, then add the lines up. Do the same for the
      tax. The invoice total should be the sum of the rounded lines, not a rounded sum.

  - id: cp73_client_billing_address
    type: additive
    area: clients
    test: acceptance/specs/cp73_client_billing_address.spec.ts
    request: |
      Let me store a billing address for a client and show it on their page.

  - id: cp74_tax_exempt_client
    type: additive
    area: billing
    test: acceptance/specs/cp74_tax_exempt_client.spec.ts
    request: |
      Let me mark a whole client as tax exempt. Then none of their invoices should have any tax,
      whatever the lines say.

  - id: cp75_effective_tax_rate
    type: additive
    area: billing
    test: acceptance/specs/cp75_effective_tax_rate.spec.ts
    request: |
      Show me the overall tax rate that actually ended up on each invoice, as a percentage.

  - id: cp76_statement_tax_totals
    type: mutative
    area: billing
    mutates: [33, 57]
    test: acceptance/specs/cp76_statement_tax_totals.spec.ts
    request: |
      On a client's statement show the tax as well — the tax for each job and the tax across the
      whole statement, alongside the amounts.

  # ---- B2 (cp77-92): discounts and adjustments deepen -------------------------------------------
  - id: cp77_fixed_amount_discount
    type: additive
    area: billing
    test: acceptance/specs/cp77_fixed_amount_discount.spec.ts
    request: |
      Let me take a flat dollar amount off an invoice as a discount, not only a percentage.

  - id: cp78_client_key_account
    type: additive
    area: clients
    test: acceptance/specs/cp78_client_key_account.spec.ts
    request: |
      Let me flag some clients as key accounts and show a marker next to them.

  - id: cp79_line_discount
    type: additive
    area: billing
    test: acceptance/specs/cp79_line_discount.spec.ts
    request: |
      Let me take a discount off a single charge line. Show that line's amount after its discount.

  - id: cp80_discount_pct_or_fixed
    type: mutative
    area: billing
    mutates: [47, 48]
    test: acceptance/specs/cp80_discount_pct_or_fixed.spec.ts
    request: |
      An invoice discount should be either a percentage or a flat amount — my choice. Either way take
      it off before tax, and show the discount clearly.

  - id: cp81_early_payment_discount
    type: additive
    area: billing
    test: acceptance/specs/cp81_early_payment_discount.spec.ts
    request: |
      Offer an early-payment discount: if it is paid within a set number of days, show the reduced
      amount they would pay.

  - id: cp82_surcharge
    type: additive
    area: billing
    test: acceptance/specs/cp82_surcharge.spec.ts
    request: |
      Let me add a surcharge to an invoice, like a small handling fee. It should add to the total.

  - id: cp83_task_due_date
    type: additive
    area: tasks
    test: acceptance/specs/cp83_task_due_date.spec.ts
    request: |
      Let me put a due date on a task and show it.

  - id: cp84_stacked_discounts
    type: mutative
    area: billing
    mutates: [47]
    test: acceptance/specs/cp84_stacked_discounts.spec.ts
    request: |
      Sometimes there is more than one discount on an invoice. Let me add several, show each one,
      and show the combined discount before tax.

  - id: cp85_discount_cap
    type: additive
    area: billing
    test: acceptance/specs/cp85_discount_cap.spec.ts
    request: |
      Let me cap a percentage discount at a maximum dollar amount, so a big invoice does not give
      away too much.

  - id: cp86_job_billable_flag
    type: additive
    area: jobs
    test: acceptance/specs/cp86_job_billable_flag.spec.ts
    request: |
      Let me mark a job as billable or not, and show which it is.

  - id: cp87_discount_as_breakdown_line
    type: additive
    area: billing
    test: acceptance/specs/cp87_discount_as_breakdown_line.spec.ts
    request: |
      In the invoice breakdown show each discount as its own negative line so the maths is obvious.

  - id: cp88_line_level_discount_in_subtotal
    type: mutative
    area: billing
    mutates: [21, 80]
