# ===================================================================================================
# ACT V (cp241-250): "stress finale" — whole-stack consistency sweeps and two REVERSALS. The
# reversals (remove the levy; collapse stacked discounts back to one) test whether the stack can
# REMOVE accumulated complexity from the spine, or whether it has fossilised — the cruelest test of
# an additive-vs-mutative architecture. Still ~80% billing, 3:1 A-A-A-M.
# ===================================================================================================

  - id: cp241_invoice_full_view
    type: additive
    area: billing
    test: acceptance/specs/cp241_invoice_full_view.spec.ts
    request: |
