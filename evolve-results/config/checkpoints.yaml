# The early-overload stream, cp1-250. GENERATED by harness.stream_build from the reference
# model harness/oracle/overload.py: edit the model (or the request wording in stream_build),
# then rebuild. Compressed spine cp2-6, hub `keel` at cp9, rules early (trim cp4, round cp8,
# hold cp12, keel-below-zero out of counts cp16, blank as zero cp20). Cadence 3:1.
checkpoints:
  - id: cp01_people
    type: additive
    area: entity
    test: acceptance/specs/cp01_people.spec.ts
    request: |
      Keep a list of people. Each has a name and three whole numbers, alpha, beta and gamma, any of
      which may be left blank. A person can also be marked as on hold, and can have other people on
      the sheet as their patrons; nothing uses either of these yet, but keep them. Show all the
      people.

  - id: cp02_thrust_thrust-total
    type: additive
    area: calc
    test: acceptance/specs/cp02_thrust_thrust-total.spec.ts
    request: |
      For each person show thrust: alpha times beta. Show thrust-total: everyone's thrust added up.
      Anything worked out from a blank number, or from a value that shows n/a, shows n/a, and a figure
      across the whole sheet skips the people for whom it is n/a.

  - id: cp03_momentum
    type: additive
    area: calc
    test: acceptance/specs/cp03_momentum.spec.ts
    request: |
      For each person show momentum: thrust plus three times (gamma minus alpha).

  - id: cp04_trim_total
    type: mutative
    area: calc
    algorithm: trim_total
    mutates: [2]
    test: acceptance/specs/cp04_trim_total.spec.ts
    request: |
      Every total across the whole sheet (thrust-total, and every total added later) now leaves out
      one highest and one lowest contribution, as long as at least two people contribute. When several
      contributions tie for highest or lowest, leave out just one of them.

  - id: cp05_scaled_third
    type: additive
    area: calc
    test: acceptance/specs/cp05_scaled_third.spec.ts
    request: |
      For each person show scaled: momentum times two. For each person show third: scaled divided by
      three (rounded down like every divide). Whenever a value is divided on this sheet, round down to
      the whole number below, also below zero (-8 divided by 3 is -3).

  - id: cp06_backing_norm
    type: additive
    area: relation
    test: acceptance/specs/cp06_backing_norm.spec.ts
    request: |
      For each person show norm: the person's scaled minus the average scaled across the sheet (the
      average over the people whose scaled is not n/a, rounded like every divide). For each person
      show backing: the momentum of each of their patrons added up (0 with no patrons; a patron whose
      momentum is n/a adds nothing; n/a when the person's own momentum is n/a). Backing is the
      person's own value, not a sheet total.

  - id: cp07_quarter_tier
    type: additive
    area: calc
    test: acceptance/specs/cp07_quarter_tier.spec.ts
    request: |
      For each person show quarter: scaled divided by four (rounded down like every divide). For each
      person show tier: SINK when scaled is below zero, STEADY from 0 up to 199, and SURGE at 200 or
      more (n/a when scaled is n/a).

  - id: cp08_round_divides
    type: mutative
    area: calc
    algorithm: round_divides
    mutates: [5, 6, 7]
    test: acceptance/specs/cp08_round_divides.spec.ts
    request: |
      Wherever a value is divided on the sheet (a value divided by a number, an average, or a half),
      round to the nearest whole number instead of down. A half rounds up to the larger number: 2.5
      becomes 3 and -2.5 becomes -2.

  - id: cp09_keel_keel-total
    type: additive
    area: calc
    test: acceptance/specs/cp09_keel_keel-total.spec.ts
    request: |
      For each person show keel: scaled plus momentum. Show keel-total: the total of keel across the
      sheet, following the rules for every sheet total (one highest and one lowest contribution are
      left out).

  - id: cp10_draft_fathom
    type: additive
    area: calc
    test: acceptance/specs/cp10_draft_fathom.spec.ts
    request: |
      For each person show fathom: keel plus momentum. For each person show draft: keel plus thrust.

  - id: cp11_cascade_trim
    type: additive
    area: calc
    test: acceptance/specs/cp11_cascade_trim.spec.ts
    request: |
      For each person show cascade: fathom plus scaled. For each person show trim: keel minus thrust.

  - id: cp12_hold
    type: mutative
    area: calc
    algorithm: hold
    mutates: [2, 4, 6, 8, 9]
    test: acceptance/specs/cp12_hold.spec.ts
    request: |
      Putting a person on hold now counts: a held person is left out of every figure across the sheet
      (every average, so norm too, every count, highest, lowest and spread), except totals, where a
      held person's value counts half (rounded like every divide), and that half is what takes part in
      leaving out the highest and lowest. A held person's own values in their row are worked out as
      usual.

  - id: cp13_heading_ripple
    type: additive
    area: calc
    test: acceptance/specs/cp13_heading_ripple.spec.ts
    request: |
      For each person show ripple: cascade plus keel. For each person show heading: keel plus norm.

  - id: cp14_ballast_keel-count
